<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | UPC Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>

  <header class="navbar-upc">
    <div class="navbar-inner">
      <nav class="navbar navbar-expand-lg p-0">
        <div class="container-fluid p-0">
          <a class="navbar-brand" href="../index.html"><span class="logo-badge">UPC</span> Connect</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="d-flex align-items-center" style="min-height:calc(100vh - 84px);">
      <div class="container">
        <div class="form-upc mx-auto" style="max-width:440px;">
          <div class="text-center mb-4">
            <span class="logo-badge mx-auto mb-2" style="display:grid;">UPC</span>
            <h1 class="h4 fw-bold mt-2">Iniciar sesión</h1>
            <p class="text-muted small">Ingresa a tu cuenta de UPC Connect</p>
          </div>

          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label class="form-label small fw-bold">Correo institucional</label>
              <input type="email" class="form-control" id="loginCorreo" placeholder="nombre@unicesar.edu.co" required />
              <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Contraseña</label>
              <input type="password" class="form-control" id="loginClave" placeholder="Mínimo 6 caracteres" required />
              <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
            </div>

            <div id="loginMensaje" class="alert alert-success small d-none" role="alert"></div>

            <button type="submit" class="btn btn-upc-solid w-100 mt-2">Iniciar sesión</button>
          </form>

          <p class="text-center small text-muted mt-4 mb-0">
            ¿Aún no tienes cuenta?
            <a href="registro.html" class="text-upc fw-bold">Regístrate aquí</a>
          </p>
        </div>
        <p class="text-center small text-muted mt-3">
          Este inicio de sesión es una simulación: todavía no existe backend ni base de datos.
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
